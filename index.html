<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WackyFlipActivity</title>
    <link rel="stylesheet" href="/css/root.css">
</head>
<body>
    <script>
        function chooseDisplayMode(opt) {
            //document.querySelector('.frame').classList.remove('hidden');
            //document.querySelector('.frame').classList.add(opt);
            document.querySelector('.resize-box').classList.add('hidden');
            const iframe = document.createElement('iframe');
            iframe.classList.add('frame');
            iframe.classList.add(opt);
            iframe.src = '/resources';
            iframe.allowFullscreen = true;
            document.querySelector('.webgl-content').appendChild(iframe);
        }
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelector('.resize-limited').addEventListener('click', () => {chooseDisplayMode('limited')});
            document.querySelector('.resize-full').addEventListener('click', () => {chooseDisplayMode('full')});
        })
    </script>
    <div class="main">
        <div class="resize-box">
            <h2>Choose a display mode</h2>
            <div class="flex-row">
                <button class="resize-limited resize-choice" >
                    <span class="choice-title">Limited View</span>
                    <img src="img/view-restore.svg" alt="Limited View">
                    <span>Useful if some UI elements are being cut off.</span>
                </button>
                <button class="resize-full resize-choice">
                    <span class="choice-title">Full View</span>
                    <img src="img/view-fullscreen.svg" alt="Full View">
                    <span>WIDESCREEN</span>
                </button>
            </div>
        </div>
        <div class="webgl-content">
            <!--<iframe title="Wacky Flip" class="frame" src="https://game.azgame.io/wacky-flip/" allowfullscreen=""></iframe>-->
        </div>
    </div>
</body>
</html>
