        <div class="main">
            <div class="loader-box">
                <span class="gameloader-progress-info"></span>
                <div class="progress">

                </div>
                <span id="loadingBlock"></span>
            </div>
            <div class="webgl-content">

        <script>
            /*var gameInstance = createUnityInstance(document.querySelector('.unity-shell'), "wackyflip_new.json", (progress) => {
                UnityProgress();
            }).then((unityInstance) => {
                UnityProgress(unityInstance, "complete");
            });*/

            var progressElement = document.getElementById('progress_fill');
            var container = document.getElementById("unity-container");
            var canvas = document.getElementById("unity-canvas");
            var loadingBar = document.querySelector("#loadingBlock");
            var progressBarFull = document.querySelector("#progress_fill");
            var progress_text = document.querySelector(".gameloader-progress-info");
            let text_percent = "";
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    progressElement.style.width = 100 * progress + "%";
                    text_percent = "Downloading file: " + Math.round(progress*100) + "%";
                    progress_text.innerText = text_percent;
                    if (progress >= 99) {
                        progress_text.innerText = "Game Loading ...";
                    }
                }).then((unityInstance) => {
                    window.unityInstance = unityInstance;
                    setTimeout(function() {
                        loadingBar.style.display = "none";
                        window.focus();
                    }, 2000);
                    container.style.display = "block";
                }).catch((message) => {
                    alert(message);
                });
            };
            document.addEventListener('DOMContentLoaded', () => {
                document.head.appendChild(script);
            })
            function firebaseLogEvent() {}
        </script>
